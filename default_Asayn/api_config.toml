# api_type: "chat_completions" (default) or "responses".
# Optional prompt_cache_key: fallback for standalone clients; agents use persisted per-session keys.
# Optional user: forwarded to Chat Completions; fallback cache key for Responses.
# For Responses, set url to the API base (including /v1 when required) or /responses.

[providers.SiliconFlow]
url = "https://api.siliconflow.cn/v1"
api_key = "your_api_key"
api_type = "chat_completions"
timeout_seconds = 120
allowed_models = [
  "deepseek-ai/DeepSeek-V4-Flash",
  "deepseek-ai/DeepSeek-V4-Pro",
  "nex-agi/Nex-N2-Pro"
]

[providers.SiliconFlow.model_limits."nex-agi/Nex-N2-Pro"]
context_window = 256000
max_output_tokens = 32768

[providers.SiliconFlow.model_limits."deepseek-ai/DeepSeek-V4-Flash"]
context_window = 1024000
max_output_tokens = 384000

[providers.SiliconFlow.model_limits."deepseek-ai/DeepSeek-V4-Pro"]
context_window = 1024000
max_output_tokens = 384000

[providers.DeepSeek]
url = "https://api.deepseek.com"
api_key = "your_api_key"
api_type = "chat_completions"
timeout_seconds = 120
allowed_models = [
  "deepseek-v4-pro",
  "deepseek-v4-flash"
]

[providers.DeepSeek.model_limits.deepseek-v4-pro]
context_window = 1024000
max_output_tokens = 384000

[providers.DeepSeek.model_limits.deepseek-v4-flash]
context_window = 1024000
max_output_tokens = 384000

[providers.XiaomiMIMO]
url = "https://api.xiaomimimo.com/v1"
api_key = "your_api_key"
api_type = "chat_completions"
timeout_seconds = 120
allowed_models = [
  "mimo-v2.5-pro",
  "mimo-v2.5"
]

[providers.XiaomiMIMO.model_limits."mimo-v2.5-pro"]
context_window = 1024000
max_output_tokens = 131072

[providers.XiaomiMIMO.model_limits."mimo-v2.5"]
context_window = 1024000
max_output_tokens = 131072

